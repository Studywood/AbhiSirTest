<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abhi Sir Classes</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#101a33">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/style.css?v=3"></head>
<body><div id="app"></div>
<button id="inst" style="display:none;position:fixed;right:14px;bottom:14px;z-index:9">Install app</button>
<script src="js/storage.js?v=3"></script><script src="js/auth.js?v=3"></script>
<script src="js/admin.js?v=3"></script><script src="js/publish.js?v=3"></script><script src="js/student.js?v=3"></script><script src="js/app.js?v=3"></script>
<script>
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
let ip;addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;const b=document.getElementById('inst');b.style.display='block';b.onclick=()=>{ip.prompt();b.style.display='none'}});
</script>
</body></html>
